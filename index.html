<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timba Karan - Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A0E27;
            --accent: #FF6B35;
            --accent-secondary: #F7931E;
            --text-light: #E8E8E8;
            --text-muted: #A0A0A0;
            --gradient-start: #FF6B35;
            --gradient-end: #F7931E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--primary);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated background elements */
        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.03;
            animation: float 20s ease-in-out infinite;
        }

        .bg-circle-1 {
            width: 500px;
            height: 500px;
            background: var(--gradient-start);
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .bg-circle-2 {
            width: 350px;
            height: 350px;
            background: var(--gradient-end);
            bottom: -100px;
            left: -100px;
            animation-delay: 5s;
        }

        .bg-circle-3 {
            width: 250px;
            height: 250px;
            background: var(--accent);
            top: 40%;
            left: 10%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Coming Soon Badge */
        .badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            animation: fadeInDown 0.8s ease-out;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
        }

        /* Main heading */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.2s backwards;
        }

        .name-highlight {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease-out 0.4s backwards;
        }

        /* Description */
        .description {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            line-height: 1.8;
            color: var(--text-muted);
            text-align: center;
            max-width: 600px;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.6s backwards;
        }

        /* Email section */
        .email-section {
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease-out 0.8s backwards;
        }

        .email-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .email-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            transition: width 0.4s ease;
            z-index: -1;
        }

        .email-link:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .email-link:hover::before {
            width: 100%;
        }

        .email-icon {
            font-size: 1.25rem;
        }

        /* Social links */
        .social-links {
            display: flex;
            gap: 1.5rem;
            animation: fadeInUp 1s ease-out 1s backwards;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 1.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            transition: width 0.4s ease;
            z-index: -1;
        }

        .social-link:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .social-link:hover::before {
            width: 100%;
        }

        .social-icon {
            font-size: 1.25rem;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: var(--text-muted);
            animation: fadeIn 1s ease-out 1.2s backwards;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .social-links {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .social-link,
            .email-link {
                justify-content: center;
            }

            .badge {
                font-size: 0.65rem;
                padding: 0.4rem 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 0.9rem;
            }

            .description {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
